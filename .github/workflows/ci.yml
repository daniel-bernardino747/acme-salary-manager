name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # First-slice check (ADR 0003): the built CommonJS API boots and loads @acme/contract via require(esm).
      - run: pnpm build
      - name: Start sequence answers /api/health
        env:
          DATABASE_PATH: ${{ runner.temp }}/acme.db
          PORT: '3000'
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/api/health && exit 0
            sleep 1
          done
          exit 1
